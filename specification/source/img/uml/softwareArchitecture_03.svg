="#A80036" points="424.06,230.96,431.5902,224.612,426.2445,226.4625,424.3941,221.1168,424.06,230.96" style="stroke: #A80036; stroke-width: 1.0;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacingAndGlyphs" textLength="49" x="439" y="199.1284">imports</text><!--
@startuml
skinparam componentStyle uml2

package "Functional Verification Tool" as vt{
    [I/O\nConfiguration]
    [Engine]
    [Viewer]
}
[CDL Parser]
[OPTIMICA]
database "Modelica\nControl\nModel" as mod_ctl
[FMU-ME]
[Reports] <<htlm, json>>
[HIL Module]

vt -d-> [CDL Parser]: uses
[I/O\nConfiguration] -d-> mod_ctl : updates point list
[Engine] -> [FMU-ME] : inserts point list
[Engine] -d-> [OPTIMICA] : invokes FMU-ME export
[OPTIMICA] -d-> mod_ctl: imports
[Engine] -l-> [HIL Module]: connects
[OPTIMICA] -> [FMU-ME] : exports
[Engine] -d-> [Reports]: writes
[Viewer] -> [Reports]: imports
@enduml

